 {const pr=pref(S.x),ct=(S.y-yref(S.x))*Math.cos(pr);if(Math.abs(ct)>CURB){S.y-=Math.sign(ct)*(Math.abs(ct)-CURB)/Math.cos(pr);S.th=pr;S.v*=.6;if(!S.onC){S.curbs++;S.onC=true;$('st').textContent='CURB CONTACT - kept on road';msgT=1}}else S.onC=false}

 gx.strokeStyle='#8886';gx.lineWidth=1;gx.setLineDash([]);gx.strokeRect(X0,Y0,X1-X0,Y1-Y0);const Y=v=>Y1-(v-lo)/(hi-lo)*(Y1-Y0);
 if(lo<0&&hi>0){gx.beginPath();gx.moveTo(X0,Y(0));gx.lineTo(X1,Y(0));gx.stroke()}
 gx.fillStyle=mut;gx.fillText(String(+hi.toFixed(1)),3,Y0+8);gx.fillText(String(+lo.toFixed(1)),3,Y1);
 if(hl!=null){gx.strokeStyle='#d33';gx.setLineDash([4,3]);gx.beginPath();gx.moveTo(X0,Y(hl));gx.lineTo(X1,Y(hl));gx.stroke();gx.setLineDash([])}
 const n=HIS.length;if(n<2)return;const t1=HIS[n-1].t,t0=Math.max(0,t1-12),T=Math.max(12,t1-t0);
 ser.forEach(q=>{gx.strokeStyle=q.c;gx.lineWidth=1.6;gx.beginPath();let st=false;for(const p of HIS){if(p.t<t0)continue;const xx=X0+(p.t-t0)/T*(X1-X0),yy=Y(Math.max(lo,Math.min(hi,p[q.k])));st?gx.lineTo(xx,yy):gx.moveTo(xx,yy);st=true}gx.stroke()});
 gx.fillStyle=mut;gx.fillText('t (s)',X1-24,y0+100)}
function plan(y0){const X0=34,X1=292,Y0=y0+16,Y1=y0+90,mut=css('--mut'),K_=80,cx=X0+12,cy=(Y0+Y1)/2;gx.font='10px system-ui';gx.fillStyle=css('--fg');gx.fillText('MPC predicted plan (car frame, forward \u2192)',X0,y0+10);
 gx.strokeStyle='#8886';gx.lineWidth=1;gx.setLineDash([]);gx.strokeRect(X0,Y0,X1-X0,Y1-Y0);gx.save();gx.beginPath();gx.rect(X0,Y0,X1-X0,Y1-Y0);gx.clip();
 const c=Math.cos(S.th),sn=Math.sin(S.th),T=(x,y)=>{const dx=x-S.x,dy=y-S.y;return[cx+(dx*c+dy*sn)*K_,cy-(-dx*sn+dy*c)*K_]};
 gx.strokeStyle=mut;gx.setLineDash([3,3]);gx.beginPath();for(let x=S.x-.3;x<S.x+3.5;x+=.1){const p=T(x,yref(x));x<S.x-.29?gx.moveTo(p[0],p[1]):gx.lineTo(p[0],p[1])}gx.stroke();gx.setLineDash([]);
 const dot=(x,y,r,col,fill)=>{const p=T(x,y);gx.beginPath();gx.arc(p[0],p[1],r*K_,0,7);fill?(gx.fillStyle=col,gx.fill()):(gx.strokeStyle=col,gx.stroke())};
 OB.forEach(o=>dot(o.x,o.y,.06,'#ff7a1a',true));DYN.forEach(d=>{const p=dpos(d,S.t),q=.8;dot(p[0],p[1],.05+d.r,d.kind==='car'?'#2f6fd6':'#e0b020',true);dot(p[0]+p[2]*q,p[1]+p[3]*q,.05+d.r,d.kind==='car'?'#2f6fd6':'#e0b020',false)});
 if(MP.tr.length){gx.strokeStyle='#22cc66';gx.lineWidth=2;gx.beginPath();MP.tr.forEach((p,i)=>{const q=T(p[0],p[1]);i?gx.lineTo(q[0],q[1]):gx.moveTo(q[0],q[1])});gx.stroke()}
 gx.fillStyle='#d9482b';gx.fillRect(cx-7,cy-4,14,8);gx.restore();gx.fillStyle=mut;gx.fillText('green = plan, dashed = path, hollow = predicted',X0+2,y0+100)}
function drawG(){gx.clearRect(0,0,300,936);const wm=HIS.reduce((a,p)=>Math.max(a,p.W),.5),jm=Math.max(5,Math.min(300,HIS.reduce((a,p)=>Math.max(a,p.J),0)));

 $('sf').textContent=f.n+' (\u03bc '+f.mu+')';$('sl').textContent=(f.a*180/Math.PI).toFixed(0)+'\u00b0';$('sp').textContent=S.v.toFixed(2)+' m/s';$('sd').textContent=(S.delta*180/Math.PI).toFixed(0)+'\u00b0';
 $('fd').textContent=f.Fd.toFixed(2)+' N';$('fl').textContent=f.Flat.toFixed(2)+' N';$('fr').textContent=f.Fr.toFixed(2)+' N';$('en').textContent=S.W.toFixed(2)+' J';$('hit').textContent=S.hits;$('crb').textContent=S.curbs;
 if((frame.n=(frame.n||0)+1)%3===0){TR.push(pos.x,pos.y+.004,pos.z);if(TR.length>1800)TR.splice(0,3);trG.setAttribute('position',new THREE.Float32BufferAttribute(TR,3))}

 const br=S.thr<0&&S.v>.05;if(msgT<=0)$('st').textContent=br?'MPC BRAKING':f.slip?'TYRES SLIPPING (understeer)':'';
 msgT-=w;
 DYN.forEach(d=>{const p=dpos(d,S.t);d.g.position.set(p[0],hAt(p[0]),-p[1]);if(d.kind==='car')d.g.rotation.y=Math.atan2(p[3],p[2])});
 if(!paused&&S.t-lastS>=.05){lastS=S.t;HIS.push({thr:S.thr,J:MP.J,minD:Math.min(MP.minD,1),uP:MP.um,t:S.t,v:S.v,d:S.delta*57.296,cmd:S.cmd*57.296,Fd:f.Fd,Fl:f.Flat,Fr:f.Fr,u:f.util,W:S.W});if(HIS.length>400)HIS.shift()}
 if(gvis&&(frame.g=(frame.g||0)+1)%2===0)drawG();
